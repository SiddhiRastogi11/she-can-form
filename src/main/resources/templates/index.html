<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She Can Foundation - Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-between">

<header class="bg-white shadow-sm border-b border-gray-100">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-purple-700 tracking-wide">She Can Foundation</h1>
        <span class="text-xs font-semibold px-2.5 py-1 bg-purple-100 text-purple-800 rounded-full">Tech Initiative</span>
    </div>
</header>

<main class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-100 transition-all duration-300">

        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Get in Touch</h2>
            <p class="text-sm text-gray-500 mt-1">We'd love to hear from you. Please fill out the form below.</p>
        </div>

        <div th:if="${successMessage}" class="mb-4 p-4 bg-green-50 border-l-4 border-green-500 rounded-r-lg text-green-700 text-sm font-medium animate-pulse">
            ✨ <span th:text="${successMessage}">Form Submitted Successfully</span>
        </div>

        <div th:if="${error}" class="mb-4 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-lg text-red-700 text-sm font-medium">
            ❌ <span th:text="${error}">An error occurred</span>
        </div>

        <form th:action="@{/submit}" th:object="${formSubmission}" method="POST" class="space-y-4">

            <div>
                <label for="name" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Full Name</label>
                <input type="text" id="name" th:field="*{name}" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                       placeholder="Jane Doe">
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email Address</label>
                <input type="email" id="email" th:field="*{email}" required
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                       placeholder="jane@example.com">
            </div>

            <div>
                <label for="message" class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Message</label>
                <textarea id="message" th:field="*{message}" rows="4"
                          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all resize-none"
                          placeholder="Write your message here..."></textarea>
            </div>

            <button type="submit"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform active:scale-[0.98]">
                Submit Form
            </button>
        </form>
    </div>
</main>

<footer class="bg-gray-100 py-4 text-center border-t border-gray-200">
    <p class="text-xs text-gray-500">&copy; 2026 She Can Foundation. Built with Spring Boot & Thymeleaf.</p>
</footer>

</body>
</html>
